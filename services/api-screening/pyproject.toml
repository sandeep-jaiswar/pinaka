[project]
name = "pinaka-api"
version = "0.1.0"
description = "Screening API for Pinaka stock analysis platform"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "duckdb>=1.0.0",
    "polars>=1.0.0",
    "pydantic>=2.0.0",
    "psycopg2-binary>=2.9.0",
    "httpx>=0.27.0",
]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-width = 4
