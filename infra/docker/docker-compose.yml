services:
  ministack:
    image: ${MINISTACK_IMAGE:-ministackorg/ministack}
    container_name: pinaka_ministack
    ports:
      - "4566:4566"
    environment:
      - MINISTACK_REGION=ap-south-1
      - MINISTACK_ACCOUNT_ID=000000000000
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4566/_ministack/health', timeout=5).read()"]
      interval: 10s
      timeout: 5s
      retries: 10

  postgres:
    image: postgres:16
    container_name: pinaka_postgres
    ports:
      - "5433:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-pinaka}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-pinaka}
      - POSTGRES_DB=${POSTGRES_DB:-pinaka_meta}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pinaka}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.1.15
    container_name: pinaka_redpanda
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp
      - "1"
      - --memory
      - 1G
      - --reserve-memory
      - 0M
      - --check=false
      - --kafka-addr
      - internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr
      - internal://redpanda:9092,external://localhost:19092
      - --pandaproxy-addr
      - internal://0.0.0.0:8082,external://0.0.0.0:18082
      - --advertise-pandaproxy-addr
      - internal://redpanda:8082,external://localhost:18082
    ports:
      - "19092:19092"
      - "18082:18082"
    healthcheck:
      test: ["CMD", "rpk", "cluster", "health"]
      interval: 15s
      timeout: 10s
      retries: 10

  dagster:
    build:
      context: ../..
      dockerfile: services/orchestrator-dagster/Dockerfile
    container_name: pinaka_dagster
    environment:
      - DAGSTER_HOME=/opt/dagster/dagster_home
      - PINAKA_MINISTACK_ENDPOINT=http://ministack:4566
      - PINAKA_POSTGRES_DSN=postgresql://pinaka:pinaka@postgres:5432/pinaka_meta
      - PINAKA_KAFKA_BROKERS=redpanda:9092
    volumes:
      - ../../services/orchestrator-dagster/dagster_home:/opt/dagster/dagster_home
      - ../../services/orchestrator-dagster/repo:/opt/dagster/repo
      - ../../services/ingestion-worker/src:/opt/dagster/ingestion-src
    ports:
      - "3000:3000"
    depends_on:
      - ministack
      - postgres
      - redpanda

volumes:
  postgres_data:
