apiVersion: apps/v1
kind: Deployment
metadata:
  name: ministack
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ministack
  template:
    metadata:
      labels:
        app: ministack
    spec:
      containers:
        - name: ministack
          image: ministackorg/ministack
          ports:
            - containerPort: 4566
          env:
            - name: MINISTACK_REGION
              value: ap-south-1
            - name: MINISTACK_ACCOUNT_ID
              value: "000000000000"
---
apiVersion: v1
kind: Service
metadata:
  name: ministack
spec:
  selector:
    app: ministack
  ports:
    - name: http
      port: 4566
      targetPort: 4566
