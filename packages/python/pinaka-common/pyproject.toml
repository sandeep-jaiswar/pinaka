[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pinaka-common"
version = "0.1.0"
description = "Pinaka shared Python utilities"
requires-python = ">=3.11"
dependencies = [
  "boto3>=1.35.0",
  "pydantic>=2.8.0",
]

[tool.setuptools.packages.find]
where = ["src"]
